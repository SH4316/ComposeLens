worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Resolve Docker service names at runtime and refresh replaced container IPs.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream api_backend {
        zone api_backend 64k;
        server backend:3000 resolve;
    }

    # The master and workers run as nginx, with writable state under /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /app/public;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Keep API misses and method errors in the backend, including /api itself.
        # No URI after proxy_pass preserves the original path and query string.
        location = /api {
            proxy_pass http://api_backend;
        }

        location ^~ /api/ {
            proxy_pass http://api_backend;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
