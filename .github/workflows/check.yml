name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend, shared]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Check types and unit tests
        working-directory: ${{ matrix.package }}
        run: npm run check

      - name: Build package
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Build and validate Pages output
        if: matrix.package == 'backend'
        working-directory: backend
        run: |
          npm run build:pages
          ./node_modules/.bin/wrangler pages functions build-env --project-dir . --outfile dist/pages-build-config.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          import { isAbsolute, join, relative, resolve, sep } from 'node:path';

          const config = JSON.parse(await readFile('dist/pages-build-config.json', 'utf8'));
          const output = resolve(config.pages_build_output_dir);
          const pathFromRoot = relative(process.cwd(), output);
          assert(pathFromRoot && !isAbsolute(pathFromRoot) && !pathFromRoot.split(sep).includes('..'),
            'Pages output must stay inside the backend project root');
          await access(join(output, 'index.html'));
          const routes = JSON.parse(await readFile(join(output, '_routes.json'), 'utf8'));
          assert(routes.include.includes('/api/*'), 'Pages must route API requests to Functions');
          NODE

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f deployment/compose.yml config --quiet

      - name: Build and start containers
        run: docker compose -f deployment/compose.yml up --build --detach --wait --wait-timeout 120

      - name: Verify static files and API routing
        run: sh deployment/smoke-test.sh

      - name: Verify DNS recovery without restarting Nginx
        run: sh deployment/check-dns-recovery.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f deployment/compose.yml logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose -f deployment/compose.yml down --remove-orphans
